    <title>Aurum Quant - XAUUSD Predictor</title>
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            var boundFetch = origFetch.bind(window);
            var activeFetch = boundFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return activeFetch; },
              set: function(fn) { activeFetch = typeof fn === 'function' ? fn : boundFetch; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
    </script>
